    - category: process_creation
      description: Detects suspicious process creation events
      platforms: [Splunk, Sentinel, Chronicle, Elastic, XSIAM]
      example_titles:
        - Suspicious PowerShell Download Cradle
        - Certutil LOLBin Abuse
        - WMIC Remote Process Creation
    - category: network_connection
      description: Detects anomalous network connection patterns
      platforms: [Splunk, Sentinel, Chronicle, Elastic, XSIAM]
      example_titles:
        - Outbound Connection to Known C2 Infrastructure
        - DNS Tunneling via TXT Records
        - Beaconing Behaviour Detection
    - category: file_event
      description: Detects suspicious file system operations
      platforms: [Splunk, Sentinel, Chronicle, Elastic, XSIAM]
      example_titles:
        - Ransomware File Extension Modification
        - Suspicious DLL Side-Loading
        - Web Shell File Write
    - category: registry_event
      description: Detects suspicious Windows registry modifications
      platforms: [Splunk, Sentinel, Elastic, XSIAM]
      example_titles:
        - Run Key Persistence
        - AMSI Bypass via Registry
        - Image File Execution Options Injection
    - category: authentication
      description: Detects anomalous authentication events
      platforms: [Splunk, Sentinel, Chronicle, Elastic, XSIAM]
      example_titles:
        - Password Spraying Detection
        - Service Account Interactive Login
        - Impossible Travel Authentication
    - category: sysmon
      description: Sysmon-specific detections for endpoint visibility
      platforms: [Splunk, Sentinel, Elastic]
      example_titles:
        - Sysmon Named Pipe Impersonation
        - Sysmon DNS Query to Suspicious TLD
        - Sysmon Process Access to LSASS

  detection_platforms:
    - name: Splunk
      rule_language: SPL
      description: Search Processing Language for Splunk Enterprise/Cloud
    - name: Microsoft Sentinel
      rule_language: KQL
      description: Kusto Query Language for Azure Sentinel analytics rules
    - name: Google Chronicle
      rule_language: YARA-L
      description: YARA-L 2.0 detection rules for Chronicle SIEM
    - name: Palo Alto XSIAM
      rule_language: XQL
      description: XQL queries for Cortex XSIAM analytics
    - name: Elastic Security
      rule_language: EQL
      description: Event Query Language for Elastic detection rules

# --------------------------------------------------------------------------
# Cross-Use-Case — Shared Mappings
# --------------------------------------------------------------------------
cross_use_case:
  mitre_tactics:
    - Reconnaissance
    - Resource Development
    - Initial Access
    - Execution
    - Persistence
    - Privilege Escalation
    - Defense Evasion
    - Credential Access
    - Discovery
    - Lateral Movement
    - Collection
    - Command and Control
    - Exfiltration
    - Impact

  severity_levels:
    - Critical
    - High
    - Medium
    - Low
    - Informational

  priority_mapping:
    P1:
      description: Immediate action required — active exploitation or critical exposure
      sla_hours: 24
    P2:
      description: High urgency — exploitable with available PoC or on KEV list
      sla_hours: 72
    P3:
      description: Standard — patch on next maintenance window
      sla_hours: 168
