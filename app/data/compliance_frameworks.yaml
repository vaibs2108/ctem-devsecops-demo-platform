  owasp_top_10_2021:
    - id: A01
      name: Broken Access Control
      cwe_ids: [CWE-200, CWE-284, CWE-285, CWE-639, CWE-862]
      pentest_focus: IDOR, privilege escalation, missing function-level access control
    - id: A02
      name: Cryptographic Failures
      cwe_ids: [CWE-259, CWE-327, CWE-328, CWE-330]
      pentest_focus: Weak TLS, hardcoded secrets, insecure key storage
    - id: A03
      name: Injection
      cwe_ids: [CWE-79, CWE-89, CWE-94, CWE-77]
      pentest_focus: SQL injection, XSS, command injection, template injection
    - id: A04
      name: Insecure Design
      cwe_ids: [CWE-209, CWE-256, CWE-501]
      pentest_focus: Business logic flaws, rate limiting bypass, trust boundary violations
    - id: A05
      name: Security Misconfiguration
      cwe_ids: [CWE-16, CWE-611]
      pentest_focus: Default credentials, directory listing, verbose errors, XXE
    - id: A06
      name: Vulnerable and Outdated Components
      cwe_ids: [CWE-1104]
      pentest_focus: Known CVE exploitation in third-party libraries
    - id: A07
      name: Identification and Authentication Failures
      cwe_ids: [CWE-287, CWE-306, CWE-384, CWE-798]
      pentest_focus: Credential stuffing, session fixation, weak password policy
    - id: A08
      name: Software and Data Integrity Failures
      cwe_ids: [CWE-502, CWE-829]
      pentest_focus: Deserialization attacks, CI/CD pipeline poisoning
    - id: A09
      name: Security Logging and Monitoring Failures
      cwe_ids: [CWE-117, CWE-223, CWE-778]
      pentest_focus: Log injection, insufficient audit trails, blind spots
    - id: A10
      name: Server-Side Request Forgery (SSRF)
      cwe_ids: [CWE-918]
      pentest_focus: Cloud metadata access, internal service enumeration

