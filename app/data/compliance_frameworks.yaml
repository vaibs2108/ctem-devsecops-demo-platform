# ============================================================================
# AI Capability Demo — Compliance & Framework Mappings
# Version: 1.0
#
# Authoritative reference for mapping findings, techniques, and rules to
# industry frameworks across all four use cases.
#
# NOTE: Technique IDs use MITRE ATT&CK v14 notation.  Sub-techniques are
# separated by a dot (e.g. T1059.001 = PowerShell under Command & Scripting
# Interpreter).
# ============================================================================

# --------------------------------------------------------------------------
# UC1 — AI-Led Continuous Threat Exposure Management (CTEM)
# --------------------------------------------------------------------------
uc1_ctem:
  accent_colour: "#00d4ff"

  mitre_attack:
    techniques:
      - id: T1190
        name: Exploit Public-Facing Application
        tactic: Initial Access
      - id: T1133
        name: External Remote Services
        tactic: Initial Access
      - id: T1078
        name: Valid Accounts
        tactic: [Initial Access, Persistence, Privilege Escalation, Defense Evasion]
      - id: T1059
        name: Command and Scripting Interpreter
        tactic: Execution
      - id: T1210
        name: Exploitation of Remote Services
        tactic: Lateral Movement
      - id: T1068
        name: Exploitation for Privilege Escalation
        tactic: Privilege Escalation
      - id: T1505.003
        name: Web Shell
        tactic: Persistence
      - id: T1070.004
        name: File Deletion
        tactic: Defense Evasion
      - id: T1071.001
        name: Web Protocols
        tactic: Command and Control
      - id: T1486
        name: Data Encrypted for Impact
        tactic: Impact

  nist_csf_2_0:
    categories:
      - id: ID.AM
        name: Asset Management
        description: Identify and manage assets within the CTEM scope
      - id: ID.RA
        name: Risk Assessment
        description: Identify and prioritise vulnerabilities by business risk
      - id: PR.IP
        name: Information Protection Processes and Procedures
        description: Patch management and configuration hardening
      - id: PR.MA
        name: Maintenance
        description: Timely remediation of validated findings
      - id: DE.CM
        name: Continuous Monitoring
        description: Ongoing vulnerability scanning and exposure tracking
      - id: RS.AN
        name: Analysis
        description: Validation and false-positive triage of findings
      - id: RC.RP
        name: Recovery Planning
        description: Mobilisation and SLA-driven remediation workflows

  cis_benchmarks:
    - id: CIS-1
      name: Inventory and Control of Enterprise Assets
      relevance: Scoping stage — asset discovery and classification
    - id: CIS-2
      name: Inventory and Control of Software Assets
      relevance: SBOM analysis and software component tracking
    - id: CIS-3
      name: Data Protection
      relevance: Business criticality classification of data stores
    - id: CIS-4
      name: Secure Configuration of Enterprise Assets and Software
      relevance: Misconfiguration detection and remediation
    - id: CIS-7
      name: Continuous Vulnerability Management
      relevance: Core CTEM lifecycle — discovery, prioritisation, validation
    - id: CIS-12
      name: Network Infrastructure Management
      relevance: Network segmentation validation during exploitation testing
    - id: CIS-16
      name: Application Software Security
      relevance: Dependency-level CVE tracking (SCA / SBOM)
    - id: CIS-18
      name: Penetration Testing
      relevance: Validation stage — exploitability confirmation

  cisa_kev:
    description: >
      CISA Known Exploited Vulnerabilities catalogue.  Any CVE on the KEV list
      receives automatic priority elevation regardless of CVSS score.  The
      platform tracks KEV collision rate as a top-level KPI.
    feed_url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json

  cvss_epss:
    description: >
      CVSS v3.1 base scores are enriched with EPSS (Exploit Prediction Scoring
      System) probabilities.  The risk_score formula used in prioritisation:
      risk_score = (cvss_score × 0.4) + (epss_score × 100 × 0.3)
                 + (kev_flag × 20) + (internet_exposed × 10)

