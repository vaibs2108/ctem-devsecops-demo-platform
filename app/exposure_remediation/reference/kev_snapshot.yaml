    cveID: CVE-2021-44228
    vendorProject: Apache
    product: Log4j2
    vulnerabilityName: Apache Log4j2 Remote Code Execution Vulnerability
    dateAdded: '2021-12-10'
    shortDescription: Apache Log4j2 contains a vulnerability where JNDI features do not protect against
      attacker-controlled JNDI-related endpoints, allowing for remote code execution.
    requiredAction: 'For all affected software assets for which updates exist, the only acceptable remediation
      actions are: 1) Apply updates; OR 2) remove affected assets from agency networks. Temporary mitigations
      using one of the measures provided at https://www.cisa.gov/uscert/ed-22-02-apache-log4j-recommended-mitigation-measures
      are only acceptable until updates are available.'
    dueDate: '2021-12-24'
