  CVE-2024-3400:
    cveID: CVE-2024-3400
    vendorProject: Palo Alto Networks
    product: PAN-OS
    vulnerabilityName: Palo Alto Networks PAN-OS Command Injection Vulnerability
    dateAdded: '2024-04-12'
    shortDescription: Palo Alto Networks PAN-OS GlobalProtect feature contains a command injection vulnerability
      that allows an unauthenticated attacker to execute commands with root privileges on the firewall.
    requiredAction: Apply mitigations per vendor instructions as they become available. Otherwise, users
      with vulnerable versions of affected devices should enable Threat Prevention IDs available from
      the vendor. See the vendor bulletin for more details and a patch release schedule.
    dueDate: '2024-04-19'
    knownRansomwareCampaignUse: Known
    forensicTriage: 'No'
