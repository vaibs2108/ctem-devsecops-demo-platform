  CVE-2023-22515:
    cveID: CVE-2023-22515
    vendorProject: Atlassian
    product: Confluence Data Center and Server
    vulnerabilityName: Atlassian Confluence Data Center and Server Broken Access Control Vulnerability
    dateAdded: '2023-10-05'
    shortDescription: Atlassian Confluence Data Center and Server contains a broken access control vulnerability
      that allows an attacker to create unauthorized Confluence administrator accounts and access Confluence.
    requiredAction: Apply mitigations per vendor instructions or discontinue use of the product if mitigations
      are unavailable. Check all affected Confluence instances for evidence of compromise per vendor instructions
      and report any positive findings to CISA.
    dueDate: '2023-10-13'
    knownRansomwareCampaignUse: Known
    forensicTriage: 'No'
    notes: https://confluence.atlassian.com/security/cve-2023-22515-privilege-escalation-vulnerability-in-confluence-data-center-and-server-1295682276.html;  https://nvd.nist.gov/vuln/detail/CVE-2023-22515
    cwes: []
